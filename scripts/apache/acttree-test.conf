# Approximates OzHosting/Plesk: .htaccess fully enabled, HTTP and HTTPS on the same docroot.
ServerName localhost

<Directory "/usr/local/apache2/htdocs">
    AllowOverride All
    Require all granted
</Directory>

Listen 443
<VirtualHost *:443>
    DocumentRoot "/usr/local/apache2/htdocs"
    SSLEngine on
    SSLCertificateFile conf/server.crt
    SSLCertificateKeyFile conf/server.key
</VirtualHost>
